name: Release

# Pushing a tag such as v0.2.0 builds a signed, notarized universal DMG and
# the signed update files that installed copies of Atelier check for, then
# publishes them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release, and the uploads to it

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # The tag must match the version baked into the app and its updates.
      - name: Check the version
        run: |
          version="$(jq -r .version package.json)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: go test .

      - name: Import the certificate and the notary credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          # The .p12 was exported without a password.
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

          # An App Store Connect API key, rather than an Apple ID password.
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$(printf %s "$APPLE_API_ISSUER_ID" | tr -d '[:space:]')"
          rm "$RUNNER_TEMP/AuthKey.p8"

          echo "APPLE_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_PROFILE=notary" >> "$GITHUB_ENV"

      # A draft first, so the build uploads to it rather than to a release
      # of its own. Re-running the workflow keeps the draft and replaces its files.
      - name: Create the draft release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Atelier ${GITHUB_REF_NAME#v}" --generate-notes
          fi

      # Signs and notarizes the app and DMG, signs the update archive, and
      # uploads them with the update manifest to the draft.
      - name: Build and upload
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun run build --platform darwin/universal -upload

      - name: Verify the DMG
        run: |
          shopt -s nullglob
          dmgs=(build/darwin-universal/*.dmg)
          test ${#dmgs[@]} -eq 1
          xcrun stapler validate "${dmgs[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmgs[0]}"

      # Publishing makes it the latest release, which installed apps check.
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
