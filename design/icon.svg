<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf5d36"/>
      <stop offset="1" stop-color="#972f19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7a6"/>
      <stop offset="0.45" stop-color="#d9a547"/>
      <stop offset="0.7" stop-color="#f2cf7a"/>
      <stop offset="1" stop-color="#a8752a"/>
    </linearGradient>
    <linearGradient id="goldIn" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fbe2a0"/>
      <stop offset="1" stop-color="#9c6a24"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5a7a"/>
      <stop offset="0.55" stop-color="#e59a62"/>
      <stop offset="1" stop-color="#f7cf8f"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7a5a"/>
      <stop offset="1" stop-color="#3f5a42"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4836"/>
      <stop offset="1" stop-color="#1e3326"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2a0e05" flood-opacity="0.45"/>
    </filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="canvas"><rect x="352" y="292" width="320" height="400"/></clipPath>
  </defs>

  <!-- The tile, on macOS's icon grid. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- The frame. -->
  <g filter="url(#shadow)">
    <rect x="282" y="222" width="460" height="540" rx="10" fill="url(#gold)"/>
  </g>
  <rect x="300" y="240" width="424" height="504" rx="4" fill="none" stroke="#fff3c9" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="330" y="270" width="364" height="444" fill="url(#goldIn)"/>
  <rect x="344" y="284" width="336" height="416" fill="#6b4a1c"/>

  <!-- The painting: the sun going down over hills and a river. -->
  <g clip-path="url(#canvas)">
    <rect x="352" y="292" width="320" height="400" fill="url(#sky)"/>
    <circle cx="560" cy="500" r="56" fill="#fff1cf"/>
    <circle cx="560" cy="500" r="92" fill="#fff1cf" opacity="0.18"/>
    <path d="M352 560 C420 500 470 500 520 540 C570 580 620 520 672 530 L672 692 L352 692 Z" fill="url(#hill1)"/>
    <path d="M352 610 C430 570 500 600 560 630 C610 655 640 620 672 615 L672 692 L352 692 Z" fill="url(#hill2)"/>
    <path d="M540 692 C560 660 600 650 612 632 C590 640 560 648 540 662 C520 676 500 684 470 692 Z" fill="#f2c27f" opacity="0.85"/>
  </g>
</svg>
